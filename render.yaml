databases:
  - name: solace-db
    plan: free
    databaseName: solace
    user: solace

services:
  - type: web
    name: solace-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy && npx prisma db seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: solace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: openai/gpt-oss-20b
      - key: CLIENT_ORIGIN
        value: "*"
